[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auton"
version = "0.1.0"
description = "AUTON — Autonomous Pentesting Agent"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
auton = "auton.cli:main"

[tool.setuptools.packages.find]
include = ["auton*", "agent*"]
